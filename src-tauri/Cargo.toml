[package]
name = "peek"
version = "0.1.0"
description = "A lightweight Windows system tray application for monitoring GitHub pull requests"
authors = ["Peek contributors"]
edition = "2021"

[lib]
name = "peek_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
