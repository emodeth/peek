[package]
name = "peek"
version = "0.1.0"
description = "A lightweight Windows system tray application for monitoring GitHub pull requests"
authors = ["Peek contributors"]
edition = "2021"

[lib]
name = "peek_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
